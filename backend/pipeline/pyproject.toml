[project]
name = "forgemirror-pipeline"
version = "0.1.0"
description = "ForgeMirror build pipeline"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50.0.1",
    "pydantic>=2.14.1",
    "typer>=0.27.2",
]

[project.scripts]
forgemirror = "forgemirror.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
extraPaths = ["."]
