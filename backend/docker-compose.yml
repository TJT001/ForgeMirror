services:
  postgres:
    image: postgres:16-alpine
    container_name: forgemirror-postgres
    environment:
      POSTGRES_USER: forgemirror
      POSTGRES_PASSWORD: forgemirror_dev
      POSTGRES_DB: forgemirror
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgemirror -d forgemirror"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
